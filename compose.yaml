services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Missing local database user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing local database password}
      POSTGRES_DB: ${POSTGRES_DB:?Missing local database name}
    volumes:
      - cetfind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: .
    restart: on-failure
    environment:
      DATABASE_URL: ${DATABASE_URL:?Missing local database URL}
      CET_ADMIN_SESSION_SECRET: ${CET_ADMIN_SESSION_SECRET:?Missing session secret}
      CET_PDF_STORAGE_BACKEND: local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cetfind_imports:/app/data/imports
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s

volumes:
  cetfind_pgdata:
  cetfind_imports:
